<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Relay Controller</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 600px; background-color: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    h1 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; color: #38bdf8; }
    .status-container { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; gap: 10px; }
    .status-badge { padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; background-color: #ef4444; color: #fff; transition: background-color 0.3s; }
    .status-badge.connected { background-color: #22c55e; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    .card { background-color: #334155; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 15px; border: 1px solid #475569; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
</head>
<body>

  <div class="container">
    <h1>ESP32 Relay Control</h1>
    <div class="status-container">
      <span>MQTT Status:</span>
      <div id="statusBadge" class="status-badge">Disconnected</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">relay_module_1</div>
        <label class="switch">
          <input type="checkbox" id="relay1" onchange="toggleRelay(1, 'LED1_ON', 'LED1_OFF')">
          <span class="slider"></span>
        </label>
      </div>

      <div class="card">
        <div class="card-title">relay_module_2</div>
        <label class="switch">
          <input type="checkbox" id="relay2" onchange="toggleRelay(2, 'LED2_ON', 'LED2_OFF')">
          <span class="slider"></span>
        </label>
      </div>

      <div class="card">
        <div class="card-title">relay_module_3</div>
        <label class="switch">
          <input type="checkbox" id="relay3" onchange="toggleRelay(3, 'LED3_ON', 'LED3_OFF')">
          <span class="slider"></span>
        </label>
      </div>

      <div class="card">
        <div class="card-title">relay_module_4</div>
        <label class="switch">
          <input type="checkbox" id="relay4" onchange="toggleRelay(4, 'LED4_ON', 'LED4_OFF')">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script>
    const brokerHost = "174ca6aa415744a08b852a7c5bfdc408.s1.eu.hivemq.cloud";
    const brokerPort = 8884;
    const username = "Ohmprakash";
    const password = "12345678";
    const topic = "esp32/relay/set";

    let client = null;
    let isConnected = false;

    function connectMQTT() {
      const clientId = "web_client_" + Math.random().toString(16).substr(2, 8);
      client = new Paho.MQTT.Client(brokerHost, Number(brokerPort), clientId);

      client.onConnectionLost = onConnectionLost;

      const options = {
        useSSL: true,
        userName: username,
        password: password,
        onSuccess: onConnect,
        onFailure: onFailure
      };

      client.connect(options);
    }

    function onConnect() {
      isConnected = true;
      const badge = document.getElementById("statusBadge");
      badge.textContent = "Connected";
      badge.classList.add("connected");
    }

    function onFailure(responseObject) {
      isConnected = false;
      const badge = document.getElementById("statusBadge");
      badge.textContent = "Connection Failed";
      badge.classList.remove("connected");
      setTimeout(connectMQTT, 5000);
    }

    function onConnectionLost(responseObject) {
      isConnected = false;
      const badge = document.getElementById("statusBadge");
      badge.textContent = "Disconnected";
      badge.classList.remove("connected");
      setTimeout(connectMQTT, 5000);
    }

    function toggleRelay(relayNumber, onPayload, offPayload) {
      if (!isConnected) {
        alert("MQTT client is not connected to HiveMQ yet. Please wait.");
        document.getElementById(`relay${relayNumber}`).checked = !document.getElementById(`relay${relayNumber}`).checked;
        return;
      }

      const isChecked = document.getElementById(`relay${relayNumber}`).checked;
      const payload = isChecked ? onPayload : offPayload;

      const message = new Paho.MQTT.Message(payload);
      message.destinationName = topic;
      client.send(message);
    }

    window.onload = connectMQTT;
  </script>
</body>
</html>
